<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Plaga Zero — Dashboards</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #090b0a;
      color: #ffffff;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 50px;
    }

    .brand {
      color: #39d353;
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .subtitle {
      color: #9fa6a1;
      font-size: 17px;
      line-height: 1.6;
    }

    .section-title {
      font-size: 22px;
      margin-bottom: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
    }

    .card {
      display: block;
      padding: 28px;
      background: #111512;
      border: 1px solid #242b26;
      border-radius: 14px;
      text-decoration: none;
      color: white;
      transition: 0.2s ease;
    }

    .card:hover {
      border-color: #39d353;
      transform: translateY(-3px);
      background: #141a16;
    }

    .tag {
      display: inline-block;
      color: #39d353;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 15px;
    }

    .card h2 {
      font-size: 21px;
      margin-bottom: 8px;
    }

    .card p {
      color: #9fa6a1;
      line-height: 1.5;
      font-size: 14px;
    }

    .arrow {
      display: block;
      margin-top: 20px;
      color: #39d353;
      font-weight: bold;
    }

    footer {
      border-top: 1px solid #202520;
      margin-top: 60px;
      padding-top: 25px;
      color: #6f7771;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      body {
        padding: 28px 18px;
      }

      h1 {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <header class="header">
      <div class="brand">Plaga Zero</div>

      <h1>Dashboards</h1>

      <p class="subtitle">
        Centro de acceso a calendarios, reportes y herramientas de trabajo de Plaga Zero.
      </p>
    </header>


    <section>

      <h2 class="section-title">Google Business Profile</h2>

      <div class="grid">

        <a class="card" href="septiembre.html">
          <span class="tag">GMB · 2026</span>

          <h2>Septiembre 2026</h2>

          <p>
            Calendario mensual de publicaciones para Google Business Profile.
          </p>

          <span class="arrow">Abrir dashboard →</span>
        </a>

      </div>

    </section>


    <footer>
      Plaga Zero · Centro de dashboards
    </footer>

  </main>

</body>
</html>
